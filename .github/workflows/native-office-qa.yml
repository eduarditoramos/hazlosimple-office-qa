name: Office disposable activation QA
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to test
        type: choice
        default: all
        options: [all, windows, mac]
permissions:
  contents: read
jobs:
  mac-native:
    if: ${{ inputs.platform != 'windows' }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Native macOS and exact launcher JSON parser
        shell: bash
        run: |
          set -euo pipefail
          uname -sm
          sw_vers
          printf '{"Code":"TEST-ONLY","Product":"office2024"}' > /tmp/qa-order.json
          value=$(osascript -l JavaScript -e 'function run(a){ObjC.import("Foundation");let d=$.NSData.dataWithContentsOfFile(a[0]);if(!d)throw Error("missing_file");let s=ObjC.unwrap($.NSString.alloc.initWithDataEncoding(d,$.NSUTF8StringEncoding));let v=JSON.parse(s);for(let k of a[1].split("."))v=v[k];if(v===undefined||v===null)throw Error("missing_field");return String(v);}' /tmp/qa-order.json Product)
          test "$value" = office2024
          echo 'Native Foundation/JXA parsing passed'
      - name: Exact public Serializer checksum and Apple native trust
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 120 --output /tmp/serializer.pkg 'https://raw.githubusercontent.com/alsyundawy/Microsoft-Office-For-MacOS/bc79d366588a5113f43d9ea10bc3e5c751dea045/DATA/Microsoft_Office_LTSC_2024_VL_Serializer.pkg'
          test "$(shasum -a 256 /tmp/serializer.pkg | awk '{print $1}')" = 083b505d9ac880629d7ef560e2baaaf59343721ac7e892be737a2403d7a63de1
          pkgutil --check-signature /tmp/serializer.pkg
          spctl --assess --type install --verbose=4 /tmp/serializer.pkg
          echo 'Native Microsoft package trust and Gatekeeper passed'
      - name: Install official Office and check app processes on disposable Mac
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 20 --max-time 600 --retry 2 --output /tmp/office.pkg 'https://res.public.onecdn.static.microsoft/mro1cdnstorage/C1297A47-86C4-4C1F-97FA-950631F94777/MacAutoupdate/Microsoft_365_and_Office_16.113.26100421_Installer.pkg'
          signature=$(LC_ALL=C pkgutil --check-signature /tmp/office.pkg)
          printf '%s\n' "$signature"
          printf '%s\n' "$signature" | grep -F 'Microsoft Corporation (UBF8T346G9)'
          spctl --assess --type install /tmp/office.pkg
          sudo installer -pkg /tmp/office.pkg -target /
          for app in 'Microsoft Word' 'Microsoft Excel' 'Microsoft PowerPoint'; do
            test -d "/Applications/$app.app"
            codesign --verify --deep --strict "/Applications/$app.app"
            open -a "$app"
            sleep 12
            pgrep -f "/Applications/$app.app/Contents/MacOS/"
            echo "INSTALLED_AND_RUNNING: $app"
          done
          echo 'Official installation and startup completed; Serializer is tested in the next step.'
      - name: Execute exact Microsoft Serializer and inspect generated state
        shell: bash
        run: |
          set -euo pipefail
          license=/Library/Preferences/com.microsoft.office.licensingV2.plist
          test ! -f "$license"
          pkgutil --check-signature /tmp/serializer.pkg | grep -F 'Microsoft Corporation (UBF8T346G9)'
          spctl --assess --type install /tmp/serializer.pkg
          sudo installer -pkg /tmp/serializer.pkg -target /
          sudo test -s "$license"
          sudo plutil -lint "$license"
          pkgutil --pkg-info com.microsoft.pkg.licensing
          pkgutil --pkg-info com.microsoft.pkg.licensing.volume
          echo 'SERIALIZER_EXECUTED: exit=0; new nonempty valid licensingV2 plist and package receipts present'
          for app in 'Microsoft Word' 'Microsoft Excel' 'Microsoft PowerPoint'; do
            pkill -f "/Applications/$app.app/Contents/MacOS/" || true
            open -a "$app"
            sleep 12
            pgrep -f "/Applications/$app.app/Contents/MacOS/" > /dev/null
            echo "POST_SERIALIZER_RUNNING: $app"
          done
          echo 'Mac license file created, but visible in-app activation and document editing are not asserted.'
      - name: Document limits
        if: always()
        shell: bash
        run: |
          echo 'Disposable VM only; installer result and license-file creation are tested. No paid customer code, Microsoft account, or private package is supplied. No retail entitlement or resale right is inferred.'
  office-apps-windows:
    if: ${{ inputs.platform != 'mac' }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        product: [office2024, m365]
        activator: [ohook, mas-aio]
    env:
      QA_PRODUCT: ${{ matrix.product }}
      QA_ACTIVATOR: ${{ matrix.activator }}
    steps:
      - name: Official Microsoft installer, installation and app startup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'official-office-qa'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $odt=Join-Path $root 'odt.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://download.microsoft.com/download/6c1eeb25-cf8b-41d9-8d0d-cc1dbc032140/officedeploymenttool_20326-20112.exe' -OutFile $odt
          $signature=Get-AuthenticodeSignature -LiteralPath $odt
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Untrusted Microsoft download' }
          $extract=Start-Process -FilePath $odt -ArgumentList ('/quiet /extract:"'+$root+'"') -Wait -PassThru
          if ($extract.ExitCode -ne 0) { throw 'ODT extraction failed' }
          $setup=Join-Path $root 'setup.exe'
          if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -ne 'Valid') { throw 'Invalid setup signature' }
          $productId=if($env:QA_PRODUCT -eq 'office2024'){'ProPlus2024Volume'}else{'O365ProPlusRetail'}
          $channel=if($env:QA_PRODUCT -eq 'office2024'){'PerpetualVL2024'}else{'Current'}
          $version=if($env:QA_PRODUCT -eq 'm365'){'Version="16.0.20430.20146"'}else{''}
          $config=Join-Path $root 'configuration.xml'
          ('<Configuration><Add SourcePath="'+$root+'" OfficeClientEdition="64" Channel="'+$channel+'" '+$version+'><Product ID="'+$productId+'"><Language ID="es-es"/><ExcludeApp ID="Teams"/><ExcludeApp ID="OneDrive"/></Product></Add><Display Level="None" AcceptEULA="FALSE"/><Property Name="FORCEAPPSHUTDOWN" Value="FALSE"/><Property Name="AUTOACTIVATE" Value="0"/></Configuration>') | Set-Content -LiteralPath $config -Encoding UTF8
          $download=Start-Process -FilePath $setup -ArgumentList ('/download "'+$config+'"') -Wait -PassThru
          if ($download.ExitCode -ne 0) { throw ('Office download failed '+$download.ExitCode) }
          $install=Start-Process -FilePath $setup -ArgumentList ('/configure "'+$config+'"') -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw ('Office installation failed '+$install.ExitCode) }
          $office=Join-Path $env:ProgramFiles 'Microsoft Office/root/Office16'
          foreach($binary in @('WINWORD.EXE','EXCEL.EXE','POWERPNT.EXE')) {
            $path=Join-Path $office $binary
            if (!(Test-Path -LiteralPath $path)) { throw ('Missing application '+$binary) }
            if ((Get-AuthenticodeSignature -LiteralPath $path).Status -ne 'Valid') { throw ('Invalid application signature '+$binary) }
            $process=Start-Process -FilePath $path -PassThru
            Start-Sleep -Seconds 12
            $name=[IO.Path]::GetFileNameWithoutExtension($binary)
            if (!(Get-Process -Name $name -ErrorAction SilentlyContinue)) { throw ('Application did not remain running '+$binary) }
            Write-Output ('INSTALLED_AND_RUNNING: '+$env:QA_PRODUCT+' '+$binary)
          }
          Write-Output 'Official application installation/startup only. No MAS, customer code, Microsoft sign-in, automatic EULA acceptance or activation test.'
      - name: Execute pinned MAS or standalone Ohook without reducing endpoint protection
        shell: powershell
        timeout-minutes: 6
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'official-office-qa'
          $prefix='https://raw.githubusercontent.com/massgravel/Microsoft-Activation-Scripts/6401d2f36975dc07bcb6d22ea823a8498a75ec01/MAS/'
          if($env:QA_ACTIVATOR -eq 'ohook') {
            $url=$prefix+'Separate-Files-Version/Activators/Ohook_Activation_AIO.cmd'
            $expected='9c77ecce70a4c7161589dbbe20d9282a0b5071dba6260abb59ca35a765f475ef'
          } else {
            $url=$prefix+'All-In-One-Version-KL/MAS_AIO.cmd'
            $expected='850f979665fb93999acae93f4790c1ff8ed2041532060b7966a121c2d29a0bfa'
          }
          $cmd=Join-Path $root 'activation.cmd'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $cmd
          if((Get-FileHash -LiteralPath $cmd -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {throw 'Activator differs from exact packaged source'}
          $defender=Get-MpComputerStatus -ErrorAction SilentlyContinue
          Write-Output ('DEFENDER_BEFORE: realtime='+$defender.RealTimeProtectionEnabled+' antivirus='+$defender.AntivirusEnabled)
          Get-Process WINWORD,EXCEL,POWERPNT -ErrorAction SilentlyContinue | Stop-Process
          $stdout=Join-Path $root 'activation-stdout.log'
          $stderr=Join-Path $root 'activation-stderr.log'
          $p=Start-Process -FilePath $env:ComSpec -ArgumentList ('/d /s /c ""'+$cmd+'" /Ohook"') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          $p.Refresh()
          $output=Get-Content -LiteralPath $stdout -Raw
          $clean=$output -replace '[A-Z0-9]{5}(-[A-Z0-9]{5}){4}','[REDACTED-GENERIC-KEY]'
          $clean -split "`r?`n" | Where-Object {$_ -match 'activated|errors were detected|Aborting|Failed|successful|sandbox'} | Select-Object -Last 30 | Write-Output
          if($p.ExitCode -ne 0 -or $output -notmatch 'Office is permanently activated\.' -or $output -match 'Some errors were detected\.') {throw ('Activator did not report successful completion. Exit='+$p.ExitCode)}
          $hooks=@(Get-ChildItem -LiteralPath (Join-Path $env:ProgramFiles 'Microsoft Office/root') -Filter 'sppc.dll' -Recurse -File)
          if($hooks.Count -lt 1) {throw 'Activator success message without installed Ohook component'}
          $defenderAfter=Get-MpComputerStatus -ErrorAction SilentlyContinue
          if($defender.RealTimeProtectionEnabled -and !$defenderAfter.RealTimeProtectionEnabled) {throw 'Realtime protection unexpectedly changed'}
          Write-Output ('ACTIVATOR_EXECUTED: product='+$env:QA_PRODUCT+' method='+$env:QA_ACTIVATOR+' exit='+$p.ExitCode+' success_message=true hook_present=true')
          Write-Output ('DEFENDER_AFTER: realtime='+$defenderAfter.RealTimeProtectionEnabled+' antivirus='+$defenderAfter.AntivirusEnabled)
          $office=Join-Path $env:ProgramFiles 'Microsoft Office/root/Office16'
          foreach($binary in @('WINWORD.EXE','EXCEL.EXE','POWERPNT.EXE')) {
            Start-Process -FilePath (Join-Path $office $binary) | Out-Null
            Start-Sleep -Seconds 12
            if(!(Get-Process -Name ([IO.Path]::GetFileNameWithoutExtension($binary)) -ErrorAction SilentlyContinue)) {throw ('App failed after activation '+$binary)}
            Write-Output ('POST_OHOOK_RUNNING: '+$env:QA_PRODUCT+' '+$env:QA_ACTIVATOR+' '+$binary)
          }
          Write-Output 'Ohook is a licensing hook; its own success message is not proof of Microsoft license entitlement or a Microsoft 365 subscription.'
      - name: Create, save and reopen a Word document and Excel workbook
        shell: powershell
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'official-office-qa'
          Get-Process WINWORD,EXCEL,POWERPNT -ErrorAction SilentlyContinue | Stop-Process
          $word=$null; $excel=$null
          try {
            $word=New-Object -ComObject Word.Application
            $word.Visible=$false
            $word.DisplayAlerts=0
            $doc=$word.Documents.Add()
            $doc.Content.Text='HazloSimple disposable activation QA'
            $docpath=Join-Path $root 'qa-document.docx'
            $doc.SaveAs2($docpath,16)
            $doc.Close(0)
            $opened=$word.Documents.Open($docpath,$false,$true)
            if($opened.Content.Text -notmatch 'HazloSimple disposable activation QA') {throw 'Word content did not survive save and reopen'}
            $opened.Close(0)
            Write-Output ('DOCUMENT_EDIT_SAVE_REOPEN: '+$env:QA_PRODUCT+' '+$env:QA_ACTIVATOR+' Word')
            $excel=New-Object -ComObject Excel.Application
            $excel.Visible=$false
            $excel.DisplayAlerts=$false
            $book=$excel.Workbooks.Add()
            $sheet=$book.Worksheets.Item(1)
            $sheet.Cells.Item(1,1).Value2=[double]12
            $sheet.Cells.Item(1,2).Value2=[double]30
            $sheet.Cells.Item(1,3).Formula='=A1+B1'
            $excel.CalculateFull()
            if($sheet.Cells.Item(1,3).Value2 -ne 42) {throw 'Excel calculation failed'}
            $bookpath=Join-Path $root 'qa-workbook.xlsx'
            $book.SaveAs($bookpath,51)
            $book.Close($false)
            $openedBook=$excel.Workbooks.Open($bookpath)
            if($openedBook.Worksheets.Item(1).Cells.Item(1,3).Value2 -ne 42) {throw 'Excel result did not survive save and reopen'}
            $openedBook.Close($false)
            Write-Output ('DOCUMENT_EDIT_SAVE_REOPEN: '+$env:QA_PRODUCT+' '+$env:QA_ACTIVATOR+' Excel')
          } finally {
            if($word){$word.Quit()}
            if($excel){$excel.Quit()}
          }
