name: Windows 10 LTSC disposable VM QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows10-ltsc:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare disposable KVM host
        run: |
          set -euo pipefail
          test -c /dev/kvm
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -gt 22000000000
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils genisoimage python3-pil
      - name: Install exact LTSC ISO and test desktop, activation and reboot
        env:
          HZS_QA_ISO_URL: ${{ secrets.HZS_QA_ISO_URL }}
          HZS_QA_ISO_USER: ${{ secrets.HZS_QA_ISO_USER }}
          HZS_QA_ISO_PASSWORD: ${{ secrets.HZS_QA_ISO_PASSWORD }}
        run: /usr/bin/python3 windows10-vm-qa.py
      - name: Retain only synthetic QA results and guest screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows10-ltsc-qa-results
          path: windows10-qa-results/
          retention-days: 3
          if-no-files-found: warn
